Description: >-
  The asymmetric signing key certificates and ledger checkpoints are signed with,
  and the two identity policies that grant it to the roles the key policy names.
  The signing operation is granted to exactly one principal, the console execution
  role, and is denied to every other principal including the account
  administrative path. That exclusivity is the reason the checkpoint signer is
  hosted inside the console function rather than in a task of its own: a second
  signing principal would end it.

  Why the grants are here rather than with the roles. The key policy names two role
  resource names as principals, and the platform validates that a principal exists
  when the key is created, so the roles stack creates both roles ahead of this
  one. Their side of the grant names this key, which does not exist until this
  stack creates it, so it is attached here to the roles by name. That split is what
  removes the cycle: the roles stack references nothing this stack creates, and this
  stack references roles that already exist.

Parameters:
  DeploymentName:
    Type: String
    Description: Prefix the key alias carries.
    Default: molt
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
  ConsoleExecutionRoleName:
    Type: String
    Description: >-
      Name of the console execution role, which is the one principal permitted to
      sign. The roles stack creates that role under this same name before this stack
      is deployed, so the key policy names an existing principal and the signing
      grant below attaches to an existing role, neither by way of an output.
    Default: molt-console-exec
  VerifierRoleName:
    Type: String
    Description: >-
      Name of the verifier role, which may read the public key and no more. Created
      by the roles stack, like the console role above.
    Default: molt-verifier
  PolicyLanguageVersion:
    Type: String
    Description: Edition of the access-policy language every policy document declares.
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

Resources:
  SigningKey:
    Type: AWS::KMS::Key
    Properties:
      Description: >-
        Asymmetric signing key for erasure certificates and ledger checkpoints.
        Digests are signed rather than payloads, so one call covers a run.
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      MultiRegion: false
      EnableKeyRotation: false
      KeyPolicy:
        Version:
          Ref: PolicyLanguageVersion
        Statement:
          # The administrative statement deliberately omits the signing
          # operation. An administrator can delete this key, which is a different
          # power from being able to sign with it, and the externally verifiable
          # checkpoint is the answer to a hostile administrator rather than a
          # policy statement.
          - Sid: AdministrationWithoutSigning
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: "*"
          - Sid: ConsoleExecutionRoleMaySign
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/${ConsoleExecutionRoleName}"
            Action:
              - kms:Sign
              - kms:GetPublicKey
            Resource: "*"
          - Sid: VerifierRoleMayReadPublicKey
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/${VerifierRoleName}"
            Action:
              - kms:GetPublicKey
            Resource: "*"
          # The exclusivity, stated rather than implied. Every principal other than the
          # console execution role is denied the signing operation, so the administrative
          # statement above cannot be widened into a second signing principal by adding
          # an action to it.
          #
          # The exception is expressed as a condition on the requesting principal rather
          # than with a not-principal element, and the difference is not stylistic: it is
          # the difference between this policy working and this policy denying the one
          # role it means to allow.
          #
          # A not-principal element naming a role's own name is matched against the
          # principal that made the request, and a function does not make requests as its
          # role — it makes them as a session assumed from that role, which is a
          # different name. So the exception matched nothing the function ever sent, the
          # denial applied to it, and signing failed for the single principal the
          # statement above grants it to. That is what happened: the scheduled checkpoint
          # ran on time and every run failed on an explicit denial, which reads like a
          # missing grant and is the opposite of one.
          #
          # The condition key below resolves to the role for a session assumed from it,
          # so it matches whether the caller is the role or a session of it. The claim is
          # unchanged and now holds for the caller that actually exists.
          - Sid: NoOtherPrincipalMaySign
            Effect: Deny
            Principal: "*"
            Action:
              - kms:Sign
            Resource: "*"
            Condition:
              StringNotLike:
                aws:PrincipalArn:
                  Fn::Sub: "arn:aws:iam::${AWS::AccountId}:role/${ConsoleExecutionRoleName}"

  # The console role's side of the signing grant, attached to the role the roles
  # stack already created. This is the only identity policy in the deployment that
  # carries the signing operation, and there is exactly one role in its subject
  # list, so the exclusivity the key policy states is matched on the identity side.
  ConsoleExecutionRoleSigningPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: console-signing
      Roles:
        - Ref: ConsoleExecutionRoleName
      PolicyDocument:
        Version:
          Ref: PolicyLanguageVersion
        Statement:
          - Sid: SignCertificatesAndCheckpoints
            Effect: Allow
            Action:
              - kms:Sign
              - kms:GetPublicKey
            Resource:
              Fn::GetAtt:
                - SigningKey
                - Arn

  # The verifier's side, which is the public half and nothing else. A verification
  # recomputes a digest locally and checks a signature against this key; it never
  # produces one.
  VerifierRolePublicKeyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: verifier-public-key
      Roles:
        - Ref: VerifierRoleName
      PolicyDocument:
        Version:
          Ref: PolicyLanguageVersion
        Statement:
          - Sid: ReadThePublicKeyOnly
            Effect: Allow
            Action:
              - kms:GetPublicKey
            Resource:
              Fn::GetAtt:
                - SigningKey
                - Arn

  SigningKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName:
        Fn::Sub: "alias/${DeploymentName}-signing"
      TargetKeyId:
        Ref: SigningKey

Outputs:
  SigningKeyId:
    Description: Identifier of the signing key the certificate builder names.
    Value:
      Ref: SigningKey
  SigningKeyArn:
    Description: Resource name of the signing key, for the console role's policy.
    Value:
      Fn::GetAtt:
        - SigningKey
        - Arn
