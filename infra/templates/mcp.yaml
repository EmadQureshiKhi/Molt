Description: >-
  The task definition and service for the tool server, joining the watcher in the
  same task cluster. It runs in a public subnet under the same outbound-only
  security group and declares no inbound listener.

  Authentication posture, stated plainly. Nothing can reach this task over the
  network: no port mapping, no load balancer, and a security group with no inbound
  rule. It is reached over the process transport by an agent running beside it, and
  it connects outbound to the cluster under the read-only role, which is what makes
  its no-mutation guarantee structural rather than conventional.

Parameters:
  DeploymentName:
    Type: String
    Default: molt
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
    Description: Prefix every resource name in this stack carries.
  ParameterPrefix:
    Type: String
    Default: /molt
    Description: Hierarchy prefix the parameter names are declared under.
  ImageUri:
    Type: String
    Description: Container image the task runs.
  ImageRepositoryName:
    Type: String
    Default: molt
    AllowedPattern: "^[a-z0-9][a-z0-9._/-]{1,255}$"
    Description: >-
      Repository the image is read from, which the execution role's read grant is
      scoped to. Taken as a name rather than parsed out of the image reference, for the
      reason the watcher stack states.
  Transport:
    Type: String
    Default: stdio
    AllowedValues:
      - stdio
      - http
    Description: >-
      How a caller reaches the tool server. The process transport reads a peer on its
      own standard input, so it belongs to a server an agent spawns rather than to one
      a service keeps running: a task carrying it has no peer, serves its tools, and
      exits, and the service restarts it forever.

      That is why the delivered desired count is zero rather than one. The deployed
      artefact of this stack is the task definition and its two roles, which is what an
      agent's own runner or a one-off task uses; the running copy of the tool server is
      the one the agent starts beside itself. Raising the count is only meaningful
      alongside the network transport, and that transport authenticates no caller, so
      the task security group admits no inbound traffic and nothing could reach it in
      this deployment anyway.
  ClusterName:
    Type: String
    Description: Name of the task cluster from the watcher stack.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The public subnets from the network stack.
  TaskSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The outbound-only group from the network stack, which has no inbound rule.
  TaskCpu:
    Type: String
    Default: "256"
  TaskMemory:
    Type: String
    Default: "512"
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    Description: >-
      Tasks the service runs. A creation waits for the service to reach steady
      state, and a task cannot reach it before the image it names exists, so a
      first deployment may bring the service up at zero and raise this once the
      image is in the registry rather than waiting out a rollback.
  LogRetentionDays:
    Type: Number
    Default: 7
  MaxResults:
    Type: Number
    Default: 50
    Description: Upper bound on rows any single tool call returns.
  EmbeddingModelId:
    Type: String
    Description: >-
      Identifier of the embedding model the selected provider calls. The recall tool
      embeds the query text it is given, so this server reaches an embedding provider
      exactly as the ingest function does. No default is declared and none is
      invented here: the repository grounds no verified model identifier, only the
      width the schema fixes, so this is an operator input the parameter file
      supplies.
  PermittedClients:
    Type: String
    Description: >-
      Tenant slugs this server may answer for, resolved at start-up and never from a
      tool argument.
  PolicyLanguageVersion:
    Type: String
    Description: Edition of the access-policy language every policy document declares.
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

Resources:
  McpLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: "/molt/${DeploymentName}/mcp"
      RetentionInDays:
        Ref: LogRetentionDays

  McpTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: molt-mcp-exec
      AssumeRolePolicyDocument:
        Version:
          Ref: PolicyLanguageVersion
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: mcp-runtime
          PolicyDocument:
            Version:
              Ref: PolicyLanguageVersion
            Statement:
              # Three statements where there was one, for the reason the watcher's
              # are: one resource cannot be right for two services, and giving the
              # registry operations a log group as their resource left no task able to
              # pull its image.
              - Sid: AskTheRegistryForATokenWhichAcceptsNoResource
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ReadTheImageFromItsOwnRepositoryOnly
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource:
                  Fn::Sub: "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImageRepositoryName}"
              - Sid: WriteItsOwnLogStreamsOnly
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub:
                    - "${LogGroupArn}:*"
                    - LogGroupArn:
                        Fn::GetAtt:
                          - McpLogGroup
                          - Arn

  # Two parameter names and the metric namespace. The embedding credential is here
  # because semantic recall embeds the query text; nothing else is, and no write
  # path exists for this role to take.
  McpTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: molt-mcp-task
      AssumeRolePolicyDocument:
        Version:
          Ref: PolicyLanguageVersion
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: mcp-least-privilege
          PolicyDocument:
            Version:
              Ref: PolicyLanguageVersion
            Statement:
              - Sid: ReadOnlyItsOwnParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/store/dsn/reader"
                  - Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/providers/embedding-credential"
              - Sid: DecryptTheParameterEncryptionKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  Fn::Sub: "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"
              - Sid: PublishMetricsInTheMoltNamespaceOnly
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Molt

  McpTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Fn::Sub: "${DeploymentName}-mcp"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu:
        Ref: TaskCpu
      Memory:
        Ref: TaskMemory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn:
        Fn::GetAtt:
          - McpTaskExecutionRole
          - Arn
      TaskRoleArn:
        Fn::GetAtt:
          - McpTaskRole
          - Arn
      ContainerDefinitions:
        - Name: mcp
          Image:
            Ref: ImageUri
          Essential: true
          # No port mapping is declared, because nothing connects to this task.
          Command:
            - molt
            - mcp
          Environment:
            - Name: MOLT_DSN_PARAM
              Value:
                Fn::Sub: "${ParameterPrefix}/store/dsn/reader"
            - Name: MOLT_DB_ROLE
              Value: reader
            # The selection this credential belongs to, stated rather than
            # defaulted. The surface defaults the embedding role to the documented
            # default provider, and this deployment must not take that default: the
            # delivered account holds zero on-demand inference quota that cannot be
            # raised, so that provider's inference service refuses every call, and
            # the credential named below belongs to the external service instead.
            # Leaving the default in place hands this task one provider's credential
            # while resolving the other, and the recall tool embeds every query it is
            # asked, so the first tool call would be the first failure.
            - Name: MOLT_EMBEDDING_PROVIDER
              Value: external
            - Name: MOLT_EMBEDDING_MODEL_ID
              Value:
                Ref: EmbeddingModelId
            - Name: MOLT_EMBEDDING_CREDENTIAL_PARAM
              Value:
                Fn::Sub: "${ParameterPrefix}/providers/embedding-credential"
            - Name: MOLT_MCP_MAX_RESULTS
              Value:
                Fn::Sub: "${MaxResults}"
            - Name: MOLT_MCP_PERMITTED_CLIENTS
              Value:
                Ref: PermittedClients
            # Stated rather than left to the surface default. Omitting it was the
            # defect: the process resolved the process transport, which reads a peer on
            # its own standard input, so a task with no peer served its tools, found
            # nothing to serve them to, and exited — and the service restarted it, once
            # a minute, indefinitely. The deployment has to choose this, because which
            # transport is right is a property of how the server is reached and not of
            # the server.
            - Name: MOLT_MCP_TRANSPORT
              Value:
                Ref: Transport
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: McpLogGroup
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: mcp

  McpService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName:
        Fn::Sub: "${DeploymentName}-mcp"
      Cluster:
        Ref: ClusterName
      LaunchType: FARGATE
      DesiredCount:
        Ref: DesiredCount
      TaskDefinition:
        Ref: McpTaskDefinition
      # No load balancer is attached, so no target group and no listener exist to
      # reach this service through.
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            Ref: PublicSubnetIds
          SecurityGroups:
            - Ref: TaskSecurityGroupId

Outputs:
  McpServiceName:
    Description: Name of the tool server service.
    Value:
      Ref: McpService
