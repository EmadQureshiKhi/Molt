Description: >-
  The cluster, task definition, and service for the policy watcher, plus the log
  group it writes to. The task runs in a public subnet with a public address so its
  outbound connection to the database costs no address translation gateway, and it
  runs under a security group that declares no inbound rule.

  Authentication posture, stated plainly. Nothing can reach this task. It declares
  no port mapping, sits behind no load balancer, and its security group admits no
  inbound traffic, so its health route is reachable in-process only. It holds one
  long-running outbound connection to the cluster under the watcher role.

Parameters:
  DeploymentName:
    Type: String
    Default: molt
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
    Description: Prefix every resource name in this stack carries.
  ParameterPrefix:
    Type: String
    Default: /molt
    Description: Hierarchy prefix the parameter names are declared under.
  ImageUri:
    Type: String
    Description: Container image the task runs.
  ImageRepositoryName:
    Type: String
    Default: molt
    AllowedPattern: "^[a-z0-9][a-z0-9._/-]{1,255}$"
    Description: >-
      Repository the image is read from, which the execution role's read grant is
      scoped to. Taken as a name rather than parsed out of the image reference,
      because a reference may name a digest, a tag, or a registry in another account,
      and a grant derived from parsing one would be wrong in a way nothing checks.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: The public subnets from the network stack.
  TaskSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: The outbound-only group from the network stack, which has no inbound rule.
  TaskCpu:
    Type: String
    Default: "256"
    Description: Smallest task size, which is what holds the fixed line item down.
  TaskMemory:
    Type: String
    Default: "512"
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    Description: >-
      Tasks the service runs. A creation waits for the service to reach steady
      state, and a task cannot reach it before the image it names exists, so a
      first deployment may bring the service up at zero and raise this once the
      image is in the registry rather than waiting out a rollback.
  LogRetentionDays:
    Type: Number
    Default: 7
  PollIntervalSeconds:
    Type: Number
    Default: 2
    Description: Interval between polls where the polling fallback is in use.
  PolicyLanguageVersion:
    Type: String
    Description: Edition of the access-policy language every policy document declares.
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

Resources:
  MoltCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName:
        Fn::Sub: "${DeploymentName}-tasks"
      CapacityProviders:
        - FARGATE
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  WatcherLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: "/molt/${DeploymentName}/watcher"
      RetentionInDays:
        Ref: LogRetentionDays

  # The role the runtime uses to fetch the image and open the log stream. It reads
  # no parameter and touches nothing of the application's.
  WatcherTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: molt-watcher-exec
      AssumeRolePolicyDocument:
        Version:
          Ref: PolicyLanguageVersion
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: watcher-runtime
          PolicyDocument:
            Version:
              Ref: PolicyLanguageVersion
            Statement:
              # Three statements where there was one, because one resource cannot be
              # right for two services at once. The single statement named the four
              # registry operations and the two log operations together and gave them
              # all the log group as their resource, so the registry grant was scoped
              # to a log group and no task could ever pull its image. The service
              # reported it as a placement failure naming an authorisation call, which
              # says nothing about the resource being wrong.
              - Sid: AskTheRegistryForATokenWhichAcceptsNoResource
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: ReadTheImageFromItsOwnRepositoryOnly
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource:
                  Fn::Sub: "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ImageRepositoryName}"
              - Sid: WriteItsOwnLogStreamsOnly
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub:
                    - "${LogGroupArn}:*"
                    - LogGroupArn:
                        Fn::GetAtt:
                          - WatcherLogGroup
                          - Arn

  # One parameter name and the metric namespace. No signing, no bucket, no model
  # invocation: the watcher reads sessions and writes policy outcomes and nothing
  # in this deployment lets it do more.
  WatcherTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: molt-watcher-task
      AssumeRolePolicyDocument:
        Version:
          Ref: PolicyLanguageVersion
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: watcher-least-privilege
          PolicyDocument:
            Version:
              Ref: PolicyLanguageVersion
            Statement:
              - Sid: ReadOnlyItsOwnParameter
                Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/store/dsn/watcher"
              - Sid: DecryptTheParameterEncryptionKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  Fn::Sub: "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"
              - Sid: PublishMetricsInTheMoltNamespaceOnly
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Molt

  WatcherTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family:
        Fn::Sub: "${DeploymentName}-watcher"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu:
        Ref: TaskCpu
      Memory:
        Ref: TaskMemory
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn:
        Fn::GetAtt:
          - WatcherTaskExecutionRole
          - Arn
      TaskRoleArn:
        Fn::GetAtt:
          - WatcherTaskRole
          - Arn
      ContainerDefinitions:
        - Name: watcher
          Image:
            Ref: ImageUri
          Essential: true
          # No port mapping is declared, because nothing connects to this task.
          Command:
            - molt
            - watch
          Environment:
            - Name: MOLT_DSN_PARAM
              Value:
                Fn::Sub: "${ParameterPrefix}/store/dsn/watcher"
            - Name: MOLT_DB_ROLE
              Value: watcher
            - Name: MOLT_WATCHER_POLL_INTERVAL_SECONDS
              Value:
                Fn::Sub: "${PollIntervalSeconds}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Ref: WatcherLogGroup
              awslogs-region:
                Ref: AWS::Region
              awslogs-stream-prefix: watcher

  WatcherService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName:
        Fn::Sub: "${DeploymentName}-watcher"
      Cluster:
        Ref: MoltCluster
      LaunchType: FARGATE
      DesiredCount:
        Ref: DesiredCount
      TaskDefinition:
        Ref: WatcherTaskDefinition
      # No load balancer is attached, so no target group and no listener exist to
      # reach this service through.
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            Ref: PublicSubnetIds
          SecurityGroups:
            - Ref: TaskSecurityGroupId

Outputs:
  ClusterName:
    Description: Name of the task cluster both long-running services run in.
    Value:
      Ref: MoltCluster
    Export:
      Name:
        Fn::Sub: "${DeploymentName}-task-cluster"
  ClusterArn:
    Description: Resource name of the task cluster.
    Value:
      Fn::GetAtt:
        - MoltCluster
        - Arn
