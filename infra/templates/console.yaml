# The reasoning is a comment rather than part of the description below, because the
# platform caps a template description at 1024 characters and refuses the template
# outright when it is longer. A comment carries no cap.
#
# The checkpoint signer is hosted in this function rather than in a task of its own
# because the signing operation is granted to this one role, and a second signing
# principal would end that exclusivity.
#
# The execution role is not declared here. The roles stack creates it, ahead of the key
# and the bucket, because the key policy names this role as its one signing principal
# and the bucket policy names it too, and the platform validates that a named principal
# exists when those resources are created. The signing grant and the certificate grant
# are attached to that role by the key stack and the storage stack, each naming the
# resource it creates. This stack takes the role's resource name as a parameter and runs
# the function under it, so the role the signer uses is the role the key policy excepts
# from its denial.
Description: >-
  The console function, its HTTPS function endpoint, its log group, and the scheduled
  rule that invokes the checkpoint signer entry point inside the same function. It runs
  under the console execution role the roles stack creates rather than declaring one.

  Authentication posture, stated plainly. The function endpoint declares no request
  signing, because the distribution in front of it is the only caller that is meant
  to reach it and a distribution cannot sign a request as a cloud principal.
  Authentication is at the application layer: the console requires the access
  credential held in the parameter store and carries session material signed with
  the session key, and an unauthenticated request is answered with a refusal rather
  than with data.

Parameters:
  DeploymentName:
    Type: String
    Default: molt
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
    Description: Prefix every resource name in this stack carries.
  ParameterPrefix:
    Type: String
    Default: /molt
    Description: Hierarchy prefix the parameter names are declared under.
  CodeBucket:
    Type: String
    Description: Bucket holding the deployment package.
  CodeKey:
    Type: String
    Description: Key of the deployment package within that bucket.
  HandlerEntryPoint:
    Type: String
    Default: molt.console.handler.handler
    Description: The console function entry point.
  CheckpointEntryPoint:
    Type: String
    Default: checkpoint_signer
    Description: >-
      The entry point inside the same function that the scheduled rule selects. The
      rule carries it in the event body rather than targeting a second function, so
      the signing role stays a single principal.
  CheckpointIntervalMinutes:
    Type: Number
    Default: 60
    MinValue: 1
    Description: Interval between checkpoint signatures, matching the configured window.
  MemorySize:
    Type: Number
    Default: 1024
  TimeoutSeconds:
    Type: Number
    Default: 60
  LogRetentionDays:
    Type: Number
    Default: 7
  ConsoleExecutionRoleArn:
    Type: String
    Description: >-
      Resource name of the console execution role, from the roles stack. Taken as a
      value rather than created here, because the key policy and the bucket policy
      name this role as a principal and a principal has to exist when they are
      created.
  SigningKeyArn:
    Type: String
    Description: >-
      Resource name of the signing key, from the key stack. Read by the process as
      the key it signs with; the permission to do so is attached to the role by the
      key stack, which is the stack that knows the key's resource name.
  CertificateBucketName:
    Type: String
    Description: >-
      Name of the certificate bucket, from the storage stack. The name rather than
      the resource name, because the process writes to a bucket by name; the grant
      that admits the write is stated by resource name in the storage stack, which
      is the stack that creates the bucket.
  CertificatePrefix:
    Type: String
    Default: certificates/
    Description: >-
      Key prefix within the bucket the process writes under. It must be the prefix
      the storage stack narrows this role's grant to: a process configured with a
      different one is refused by the bucket policy.
  AdjudicationModelId:
    Type: String
    Description: >-
      Identifier of the model the adjudication role calls. No default is declared
      and none is invented here: the repository grounds no verified model
      identifier, only the shape each model is verified against, so this is an
      operator input the parameter file supplies.
  BackupTarget:
    Type: String
    Description: >-
      Where a pre-erasure backup is written. The erasure path reads it before it mutates
      anything, and it carries no default on the configuration surface, so a console that
      was never given one refuses every run it is asked to start.

      That refusal was invisible until an erasure was started on a deployment: the request
      is recorded and answered with its identifier, the work happens in a second
      invocation, and the missing value surfaced there as an aborted run rather than as a
      refused request. A console that cannot back up cannot erase, and it should say so
      when it is deployed rather than when it is used.
  ClusterIdentifier:
    Type: String
    Description: >-
      The cluster the control-plane backup path names. It is a non-secret identifier the
      provider assigns, and the path that uses it is taken only where the capability
      record says the control plane offers an on-demand backup; where it does not, the
      self-managed path runs instead and this value is unused.
  DemonstrationMode:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Whether this console serves an anonymous reviewer rather than an operator.

      In demonstration mode a visitor is given a session without presenting a
      credential, so every read-only page is reachable by opening the address, and every
      route that would change stored memory is refused — the control is still rendered,
      disabled, stating why, so a reviewer sees what the console can do rather than a
      page with the capability hidden. The refused set is derived from the route table's
      own methods rather than from a list kept beside it, so a mutating route added later
      is refused without anyone remembering to add it.

      The tenant roster is narrowed to the seeded tenants in this mode as well, which is
      what keeps a public demonstration off anything a real engagement created.

      It defaults to false because an operator console is the ordinary case and a
      deployment that served an anonymous session by default would be one nobody had
      decided to make public.

  RewriteModelId:
    Type: String
    Description: >-
      Identifier of the model the redaction rewrite role calls. Separate from the
      adjudication identifier because the two text roles share one provider and name
      different models, so a single value would answer which provider without
      answering which model.

Resources:
  ConsoleLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${DeploymentName}-console"
      RetentionInDays:
        Ref: LogRetentionDays

  ConsoleFunction:
    Type: AWS::Lambda::Function
    DependsOn: ConsoleLogGroup
    Properties:
      FunctionName:
        Fn::Sub: "${DeploymentName}-console"
      Runtime: python3.12
      Architectures:
        - arm64
      Handler:
        Ref: HandlerEntryPoint
      # The roles stack creates the role this function runs under, and the
      # deployment resolves its output into this parameter. It is the one role the
      # key policy excepts from its denial of the signing operation, and the key
      # stack attaches that grant to it; the storage stack attaches the
      # certificate-prefix grant. Everything not coupled to those two resources —
      # the eraser and reader connection strings, the console credential and
      # session key, the text credential, the two text models, the metric
      # namespace, and this log group — is held by the role itself.
      Role:
        Ref: ConsoleExecutionRoleArn
      Code:
        S3Bucket:
          Ref: CodeBucket
        S3Key:
          Ref: CodeKey
      MemorySize:
        Ref: MemorySize
      Timeout:
        Ref: TimeoutSeconds
      LoggingConfig:
        LogGroup:
          Ref: ConsoleLogGroup
      Environment:
        Variables:
          # Every name here is a key the configuration surface declares. A name the
          # surface does not declare is read by nothing, so it would leave the value
          # it carries unresolved and the process refusing at startup for a value an
          # operator can see is set. `tests/infra/test_templates.py` asserts the set.
          MOLT_DSN_PARAM:
            Fn::Sub: "${ParameterPrefix}/store/dsn/eraser"
          # The console holds the eraser role because the erasure console runs
          # erasures from this same function. The Sensitivity_Analyzer refuses any
          # role that can write, so it is given a read-only connection of its own
          # rather than being run under the wider one.
          MOLT_READER_DSN_PARAM:
            Fn::Sub: "${ParameterPrefix}/store/dsn/reader"
          MOLT_CONSOLE_CREDENTIAL_PARAM:
            Fn::Sub: "${ParameterPrefix}/console/credential"
          MOLT_CONSOLE_SESSION_KEY_PARAM:
            Fn::Sub: "${ParameterPrefix}/console/session-key"
          MOLT_TEXT_CREDENTIAL_PARAM:
            Fn::Sub: "${ParameterPrefix}/providers/text-credential"
          # The selection this credential belongs to, stated rather than defaulted.
          # The surface defaults the text role to the documented default provider,
          # and this deployment must not take that default: the delivered account
          # holds zero on-demand inference quota that cannot be raised, so the
          # default provider's inference service refuses every call, and the
          # credential named above belongs to the external service instead. Leaving
          # the default in place hands this function one provider's credential while
          # resolving the other. The external implementation also carries the cost
          # argument, since adjudication repeats one byte-identical prefix across
          # every review-band candidate and prompt caching turns that into one paid
          # write and many cheap reads.
          MOLT_TEXT_PROVIDER: external
          # Both text roles name their own model against that one provider, and
          # neither key carries a default, so a selection without both identifiers
          # moves the startup refusal rather than removing it.
          MOLT_ADJUDICATION_MODEL_ID:
            Ref: AdjudicationModelId
          MOLT_REWRITE_MODEL_ID:
            Ref: RewriteModelId
          MOLT_DEMO_MODE:
            Ref: DemonstrationMode
          MOLT_BACKUP_TARGET:
            Ref: BackupTarget
          MOLT_CCLOUD_CLUSTER_ID:
            Ref: ClusterIdentifier
          MOLT_DB_ROLE: eraser
          MOLT_KMS_KEY_ID:
            Ref: SigningKeyArn
          # The bucket and the prefix the certificate writer uses. Both are given
          # here rather than left to a configuration file, because the bucket name
          # is generated from the account and the region and the prefix is the same
          # one the write grant above narrows to: a process configured with a
          # different prefix from its grant is refused by the bucket policy.
          MOLT_CERT_BUCKET:
            Ref: CertificateBucketName
          MOLT_CERT_PREFIX:
            Ref: CertificatePrefix

  ConsoleFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn:
        Fn::GetAtt:
          - ConsoleFunction
          - Arn
      # No request signing at this layer; the console's own credential and signed
      # session material are checked on every request inside the function.
      AuthType: NONE
      InvokeMode: BUFFERED

  ConsoleFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: ConsoleFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # One rule, one invocation per interval, no standing task. The entry point is
  # carried in the event body, so the signer runs in the function that already
  # holds the signing grant.
  CheckpointScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: "${DeploymentName}-checkpoint"
      Description: Invokes the checkpoint signer entry point inside the console function.
      ScheduleExpression:
        Fn::Sub: "rate(${CheckpointIntervalMinutes} minutes)"
      State: ENABLED
      Targets:
        - Id: console-checkpoint-entry-point
          Arn:
            Fn::GetAtt:
              - ConsoleFunction
              - Arn
          Input:
            Fn::Sub: '{"entry_point": "${CheckpointEntryPoint}"}'

  CheckpointSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: ConsoleFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::GetAtt:
          - CheckpointScheduleRule
          - Arn

Outputs:
  ConsoleFunctionUrl:
    Description: The HTTPS endpoint the distribution fronts as its single origin.
    Value:
      Fn::GetAtt:
        - ConsoleFunctionUrl
        - FunctionUrl
  ConsoleFunctionName:
    Description: >-
      Name of the console function. The execution role is no output of this stack
      any more: the roles stack creates it and publishes its resource name, and the
      one signing principal is that role.
    Value:
      Ref: ConsoleFunction
