Description: >-
  The ingest function, its HTTPS function endpoint, its execution role, and its log
  group. Reserved concurrency is declared, which is what bounds the cost of a
  leaked bearer token: a flood is served by at most the declared number of
  executions and the rest are refused.

  Authentication posture, stated plainly. The function endpoint declares no
  request signing, because the callers are capture hooks on developer machines that
  hold no cloud credential. Authentication is therefore at the application layer
  and is mandatory there: every request carries the bearer token from the parameter
  store and a signature keyed with the ingest signing secret over the body, and a
  request older than the configured age is refused, which bounds replay.

Parameters:
  DeploymentName:
    Type: String
    Default: molt
    AllowedPattern: "^[a-z][a-z0-9-]{1,30}$"
    Description: Prefix every resource name in this stack carries.
  ParameterPrefix:
    Type: String
    Default: /molt
    Description: Hierarchy prefix the parameter names are declared under.
  CodeBucket:
    Type: String
    Description: Bucket holding the deployment package.
  CodeKey:
    Type: String
    Description: Key of the deployment package within that bucket.
  HandlerEntryPoint:
    Type: String
    Default: molt.collector.handler.handler
    Description: The function entry point, which is one request in and one reply out.
  ReservedConcurrency:
    Type: Number
    Default: 10
    MinValue: 1
    Description: >-
      Ceiling on concurrent ingest executions. This is a cost control rather than a
      performance setting: it is what makes a leaked token bounded.
  MemorySize:
    Type: Number
    Default: 512
  TimeoutSeconds:
    Type: Number
    Default: 30
  LogRetentionDays:
    Type: Number
    Default: 7
  EmbeddingModelArn:
    Type: String
    Description: >-
      Resource name of the embedding model the documented default provider calls.
      Granting it keeps the default path deployable without a policy change; where
      the configuration selects an external provider no model permission is used at
      all.
  PolicyLanguageVersion:
    Type: String
    Description: Edition of the access-policy language every policy document declares.
    AllowedPattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

Resources:
  CollectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: "/aws/lambda/${DeploymentName}-collector"
      RetentionInDays:
        Ref: LogRetentionDays

  # Four parameter names, one model resource, one metric namespace, and one log
  # group. Nothing else: this role cannot sign, cannot read or write the
  # certificate bucket, and cannot reach another role's connection string.
  CollectorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: molt-collector-exec
      AssumeRolePolicyDocument:
        Version:
          Ref: PolicyLanguageVersion
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: collector-least-privilege
          PolicyDocument:
            Version:
              Ref: PolicyLanguageVersion
            Statement:
              - Sid: ReadOnlyItsOwnParameters
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/store/dsn/writer"
                  - Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/collector/token"
                  - Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/collector/ingress-secret"
                  - Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/collector/ingress-max-age-seconds"
                  - Fn::Sub: "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/providers/embedding-credential"
              - Sid: DecryptTheParameterEncryptionKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                Resource:
                  Fn::Sub: "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm"
              - Sid: InvokeTheEmbeddingModelOnly
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                Resource:
                  Ref: EmbeddingModelArn
              # The one statement in this deployment whose resource is open, and
              # it is conditioned on the metric namespace because the operation
              # accepts no resource of its own.
              - Sid: PublishMetricsInTheMoltNamespaceOnly
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Molt
              - Sid: WriteItsOwnLogStreamsOnly
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub:
                    - "${LogGroupArn}:*"
                    - LogGroupArn:
                        Fn::GetAtt:
                          - CollectorLogGroup
                          - Arn

  CollectorFunction:
    Type: AWS::Lambda::Function
    DependsOn: CollectorLogGroup
    Properties:
      FunctionName:
        Fn::Sub: "${DeploymentName}-collector"
      Runtime: python3.12
      Architectures:
        - arm64
      Handler:
        Ref: HandlerEntryPoint
      Role:
        Fn::GetAtt:
          - CollectorExecutionRole
          - Arn
      Code:
        S3Bucket:
          Ref: CodeBucket
        S3Key:
          Ref: CodeKey
      MemorySize:
        Ref: MemorySize
      Timeout:
        Ref: TimeoutSeconds
      ReservedConcurrentExecutions:
        Ref: ReservedConcurrency
      LoggingConfig:
        LogGroup:
          Ref: CollectorLogGroup
      Environment:
        Variables:
          MOLT_PARAMETER_PREFIX:
            Ref: ParameterPrefix
          MOLT_STORE_DSN_PARAM:
            Fn::Sub: "${ParameterPrefix}/store/dsn/writer"
          MOLT_COLLECTOR_TOKEN_PARAM:
            Fn::Sub: "${ParameterPrefix}/collector/token"
          MOLT_INGRESS_SECRET_PARAM:
            Fn::Sub: "${ParameterPrefix}/collector/ingress-secret"
          MOLT_EMBEDDING_CREDENTIAL_PARAM:
            Fn::Sub: "${ParameterPrefix}/providers/embedding-credential"
          MOLT_STORE_ROLE: writer

  # The HTTPS endpoint. There is no load balancer and no custom domain: the
  # generated endpoint terminates transport security on its own certificate.
  CollectorFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn:
        Fn::GetAtt:
          - CollectorFunction
          - Arn
      # No request signing at this layer, because a capture hook holds no cloud
      # credential. The bearer token and the body signature are checked inside the
      # function on every request, and neither is optional there.
      AuthType: NONE
      InvokeMode: BUFFERED

  CollectorFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: CollectorFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  CollectorFunctionUrl:
    Description: The HTTPS endpoint the capture surfaces post to.
    Value:
      Fn::GetAtt:
        - CollectorFunctionUrl
        - FunctionUrl
  CollectorExecutionRoleArn:
    Description: Resource name of the ingest execution role.
    Value:
      Fn::GetAtt:
        - CollectorExecutionRole
        - Arn
